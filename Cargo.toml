[package]
name = "heinzel"
version = "0.1.0"
edition = "2024"
# redb needs 1.90 (edition 2024 and let chains alone would need 1.88).
rust-version = "1.90"
publish = false

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "server-graceful", "service", "tokio"] }
nix = { version = "0.31.3", features = ["signal", "user"] }
redb = "4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

[dev-dependencies]
proc-macro2 = "1.0.107"
syn = { version = "3.0.9", features = ["full", "visit"] }
