name: infra

on:
  pull_request:
    paths:
      - infra/**
      - Makefile
      - .github/workflows/infra.yml
  push:
    branches: [main]
    # Code and inputs only: docs and tests don't deploy. App changes deploy
    # too: every deploy builds and pushes the image for HEAD.
    paths:
      - cmd/**
      - internal/**
      - deploy/**
      - go.mod
      - go.sum
      - infra/**/*.tf
      - infra/terraform.tfvars
      - infra/.terraform.lock.hcl
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TOFU_VERSION: 1.12.x

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: make infra-check

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # arm64 runner: the image is linux/arm64, so it builds natively, no QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a running apply is never cancelled (only the newest queued run is kept).
    concurrency:
      group: infra-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: eu-central-1
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the state bucket
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Repository variable TF_STATE_BUCKET is not set. CI needs S3 state (infra/README.md § Deploying from GitHub Actions)."
            exit 1
          fi

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::945752100213:role/github-actions/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure the S3 backend
        working-directory: infra
        run: |
          cat > backend_override.tf <<'HCL'
          terraform {
            backend "s3" {}
          }
          HCL
          cat > s3.tfbackend <<HCL
          bucket       = "${TF_STATE_BUCKET}"
          key          = "underling/terraform.tfstate"
          region       = "${TF_STATE_REGION}"
          use_lockfile = true
          HCL

      - name: Init
        run: tofu -chdir=infra init -input=false -lockfile=readonly -backend-config=s3.tfbackend

      - name: Check
        run: |
          tofu -chdir=infra fmt -check -recursive
          tofu -chdir=infra validate

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The image bundles the Codex and auto-task plugins. Locally they come
      # from Claude Code's plugin cache; here we lay out the same
      # <dir>/<name>/<version> tree from the pinned upstream commits.
      - name: Stage plugins
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/plugin-cache"
          clone() { # repo sha dest
            git clone --quiet "https://github.com/$1.git" "$RUNNER_TEMP/src-$$"
            git -C "$RUNNER_TEMP/src-$$" checkout --quiet "$2"
            mkdir -p "$(dirname "$3")"
            cp -R "$RUNNER_TEMP/src-$$/${4:-.}" "$3"
            rm -rf "$3/.git" "$RUNNER_TEMP/src-$$"
          }
          clone openai/codex-plugin-cc db52e28f4d9ded852ab3942cea316258ae4ef346 "$cache/openai-codex/codex/1.0.6" plugins/codex
          clone patforna/auto-task 69cf9e8bcac06308166d1e254b92304b3cda5787 "$cache/auto-task/at/0.1.0"
          echo "PLUGIN_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Build and push the image
        run: |
          set -euo pipefail
          tag="$(git rev-parse --short=12 HEAD)"
          repo="$(tofu -chdir=infra output -raw ecr_repository_url)"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          # Tags are immutable: a re-run of the same commit reuses the image.
          if aws ecr describe-images --repository-name "${repo##*/}" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            echo "image $tag is already in ECR"
          else
            make image IMAGE_TAG="$tag"
            make image-push ECR_REPOSITORY_URL="$repo" IMAGE_TAG="$tag"
          fi

      - name: Apply
        run: tofu -chdir=infra apply -input=false -auto-approve -var "image_tag=$IMAGE_TAG"
